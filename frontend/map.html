<!DOCTYPE html>
<!-- -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaunchMap – Network Map Prototype</title>
<style>
  :root {
    --bg: #f4ecd9;
    --surface: #fffbf2;
    --surface2: #f1e6cf;
    --border: #ddcda8;
    --accent: #3f6b4a;
    --accent2: #6b8caa;
    --accent3: #7a9c6f;
    --text: #2b2418;
    --text2: #6b5f4d;
    --text3: #a8987a;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent, transparent 30px,
      rgba(43,36,24,0.05) 31px
    );
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ── SCREEN 1: INPUT ── */
  #screen-input .card {
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(43,36,24,0.08);
  }
  .logo {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .logo span { color: var(--accent); }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text2);
    margin: 14px 0 6px;
  }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 11px 13px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--accent), #274a33);
    border: none;
    border-radius: 10px;
    color: #fff8ee;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(63,107,74,0.3);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    width: auto;
    padding: 9px 18px;
    font-size: 13px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(43,36,24,0.06);
  }

  /* ── SCREEN 2: MAP ── */
  #screen-map { flex-direction: column; }
  .map-header {
    position: absolute;
    top: 24px;
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .map-ruler {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 4;
  }
  .map-ruler-line {
    width: 260px;
    height: 1px;
    background: var(--text3);
    margin: 0 auto 8px;
  }
  .map-ruler-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text2);
    text-transform: uppercase;
  }
  .map-hint {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }
  .map-stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .center-node {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 170px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 38% 32%, #9dc2a0 0%, #4a7a68 50%, #23423a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    color: #fff8ee;
    padding: 12px;
    box-shadow: 0 20px 50px rgba(35,66,58,0.35), inset 0 -8px 20px rgba(0,0,0,0.15);
    z-index: 5;
  }
  .orbit-node {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    color: #fff8ee;
    cursor: pointer;
    padding: 8px;
    line-height: 1.25;
    overflow: hidden;
    box-shadow: 0 14px 22px rgba(43,36,24,0.32), 0 2px 5px rgba(43,36,24,0.18);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: nodeIn 0.5s ease forwards;
  }
  .orbit-node:hover {
    transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1) !important;
    box-shadow: 0 18px 30px rgba(43,36,24,0.4), 0 3px 6px rgba(43,36,24,0.2);
    z-index: 8;
  }
  @keyframes nodeIn {
    from { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.4); }
    to   { opacity: 1; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); }
  }
  .connector {
    position: absolute;
    top: 50%; left: 50%;
    height: 1px;
    background: linear-gradient(90deg, rgba(63,107,74,0.35), transparent);
    transform-origin: left center;
    z-index: 1;
  }

  /* ── SCREEN 3: PLAYBOOK FULLSCREEN ── */
  #screen-playbook {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    overflow-y: auto;
    padding: 40px 60px;
  }
  .playbook-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .playbook-title { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--text); }
  .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(63,107,74,0.12);
    color: var(--accent);
    margin-top: 8px;
  }
  .pb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .pb-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 6px 18px rgba(43,36,24,0.06);
  }
  .pb-card.full { grid-column: 1 / -1; }
  .pb-card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .pb-card ul { list-style: none; }
  .pb-card li {
    font-size: 14px;
    color: var(--text2);
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .pb-card li:last-child { border-bottom: none; }
  .post-body, .dm { white-space: pre-wrap; font-size: 13px; color: var(--text2); line-height: 1.7; }
  .center-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- SCREEN 1: INPUT -->
<div class="screen active" id="screen-input">
  <div class="card">
    <div class="logo">Launch<span>Map</span></div>
    <label>Startup Name</label>
    <input id="s-name" placeholder="e.g. NoteAI" value="NoteAI" />
    <label>What does it do?</label>
    <textarea id="s-desc">AI tool that automatically writes session notes for therapists after each client call, saving 2+ hours per day</textarea>
    <label>Target customer</label>
    <input id="s-customer" value="Independent therapists running private practices" />
    <label>Stage</label>
    <select id="s-stage">
      <option value="idea">Idea stage</option>
      <option value="pre-launch" selected>Pre-launch</option>
      <option value="launched">Launched (0-100 users)</option>
      <option value="growing">Growing (100+ users)</option>
    </select>
    <label>Sector</label>
    <select id="s-category">
      <option value="healthtech" selected>Healthtech / Wellness</option>
      <option value="b2b-saas">B2B SaaS</option>
      <option value="fintech">Fintech</option>
      <option value="edtech">Edtech</option>
      <option value="developer-tools">Developer Tools</option>
      <option value="ai">AI / ML</option>
      <option value="general-startup">Other / General</option>
    </select>
    <button class="btn" id="find-btn" onclick="findCommunities()">Map My Network →</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="loadDemoData()">🧪 Preview with demo data</button>
  </div>
</div>

<!-- SCREEN 2: MAP -->
<div class="screen" id="screen-map">
  <div class="map-header">
    <div class="logo">Launch<span>Map</span></div>
    <button class="btn btn-ghost" onclick="goToScreen('screen-input')">← Start over</button>
  </div>
  <div class="map-ruler">
    <div class="map-ruler-line"></div>
    <div class="map-ruler-label" id="map-ruler-label">Communities found</div>
  </div>
  <div class="map-stage" id="map-stage"></div>
  <div class="map-hint">Click a community to generate its activation playbook</div>
</div>

<!-- SCREEN 3: PLAYBOOK -->
<div class="screen" id="screen-playbook">
  <div class="playbook-top">
    <div>
      <div class="playbook-title" id="pb-title">—</div>
      <span class="tag" id="pb-platform">—</span>
    </div>
    <button class="btn btn-ghost" onclick="goToScreen('screen-map')">← Back to map</button>
  </div>
  <div id="pb-body"></div>
</div>

<script>
const API_BASE = '/api';
let currentStartup = null;
let currentCommunities = [];

function goToScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadDemoData() {
  currentStartup = {name:'NoteAI', description:'x', target_customer:'therapists', stage:'pre-launch', category:'healthtech'};
  renderMap([
    {name:'r/therapists', platform:'Reddit', relevance_score:92},
    {name:'Therapist Slack', platform:'Slack', relevance_score:85},
    {name:'r/HealthTech', platform:'Reddit', relevance_score:78},
    {name:'Build In Public Discord', platform:'Discord', relevance_score:65}
  ]);
  goToScreen('screen-map');
}

async function findCommunities() {
  currentStartup = {
    name: document.getElementById('s-name').value.trim(),
    description: document.getElementById('s-desc').value.trim(),
    target_customer: document.getElementById('s-customer').value.trim(),
    stage: document.getElementById('s-stage').value,
    category: document.getElementById('s-category').value,
  };
  if (!currentStartup.name || !currentStartup.description || !currentStartup.target_customer) {
    alert('Please fill in all fields.');
    return;
  }

  const btn = document.getElementById('find-btn');
  btn.disabled = true;
  btn.textContent = 'Scanning 2,847 communities...';

  try {
    const res = await fetch(`${API_BASE}/find-communities`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentStartup),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    currentCommunities = data.communities;
    renderMap(currentCommunities);
    goToScreen('screen-map');
  } catch (err) {
    alert('Error connecting to API.\n\n' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Map My Network →';
  }
}

const PLATFORM_COLORS = {
  'Reddit': '#5c7a52',
  'Discord': '#4a7a8c',
  'Slack': '#6b8caa',
  'Facebook': '#3f6b6b',
  'LinkedIn': '#4a6b4a',
  'Forum': '#7a9c6f',
  'Newsletter': '#5f8577',
  'Meetup': '#5a8a7a',
  'Twitter/X': '#4a5568',
};

function renderMap(communities) {
  const stage = document.getElementById('map-stage');
  stage.innerHTML = '';
  document.getElementById('map-ruler-label').textContent = communities.length + ' communities found';

  // center node
  const center = document.createElement('div');
  center.className = 'center-node';
  center.textContent = currentStartup.name;
  stage.appendChild(center);

  const cx = stage.clientWidth / 2 || window.innerWidth / 2;
  const cy = stage.clientHeight / 2 || window.innerHeight / 2;
  const n = communities.length;

  // Base bubble size per community, tamed down as the count grows so a busy
  // result set doesn't produce giant overlapping circles.
  const sizeScale = n <= 6 ? 1 : Math.max(0.55, 6 / n);
  let sizes = communities.map(c => (60 + (c.relevance_score || 70) * 0.55) * sizeScale);

  // Pick a radius large enough that adjacent bubbles (by circumference,
  // weighted by their own diameter) don't touch, then shrink everything
  // proportionally if that radius wouldn't fit on screen.
  const SPACING = 1.35;
  let totalDiameter = sizes.reduce((a, b) => a + b, 0);
  let radius = Math.max(170, (totalDiameter * SPACING) / (2 * Math.PI));
  const maxRadius = Math.min(cx, cy) * 0.78;
  if (radius > maxRadius) {
    const shrink = maxRadius / radius;
    sizes = sizes.map(s => s * shrink);
    radius = maxRadius;
  }

  // Reserve a wedge at the top for the "N communities found" ruler so no
  // bubble ever lands underneath it, regardless of how many there are.
  const EXCLUDE_HALF = 0.6; // radians (~34°) kept clear at the top
  const startAngle = -Math.PI / 2 + EXCLUDE_HALF;
  const totalArc = 2 * Math.PI - 2 * EXCLUDE_HALF;

  communities.forEach((c, i) => {
    const angle = startAngle + ((i + 0.5) / n) * totalArc;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);
    const score = c.relevance_score || 70;
    const size = sizes[i];

    // connector line
    const dist = Math.sqrt(x * x + y * y);
    const angleDeg = Math.atan2(y, x) * (180 / Math.PI);
    const line = document.createElement('div');
    line.className = 'connector';
    line.style.width = dist + 'px';
    line.style.transform = `rotate(${angleDeg}deg)`;
    stage.appendChild(line);

    // node
    const node = document.createElement('div');
    node.className = 'orbit-node';
    node.style.width = size + 'px';
    node.style.height = size + 'px';
    node.style.background = PLATFORM_COLORS[c.platform] || '#5a6b5f';
    node.style.setProperty('--tx', x + 'px');
    node.style.setProperty('--ty', y + 'px');
    node.style.animationDelay = (i * 0.06) + 's';
    node.style.fontSize = Math.max(8, Math.min(11, size * 0.1)) + 'px';
    if (size < 70) {
      node.innerHTML = `<span style="white-space:nowrap;font-weight:700">${score}%</span>`;
    } else {
      const maxChars = Math.max(10, Math.round(size / 7));
      const label = c.name.length > maxChars ? c.name.slice(0, maxChars - 1) + '…' : c.name;
      node.innerHTML = `${label}<br><span style="opacity:0.85;font-weight:600;white-space:nowrap">${score}%</span>`;
    }
    node.title = c.name;
    node.onclick = () => generatePlaybook(c);
    stage.appendChild(node);
  });
}

async function generatePlaybook(community) {
  goToScreen('screen-playbook');
  document.getElementById('pb-title').textContent = community.name;
  document.getElementById('pb-platform').textContent = community.platform;
  document.getElementById('pb-body').innerHTML = `
    <div class="center-loading">
      <div class="spinner"></div>
      <div style="color:var(--text2)">Generating activation playbook for ${community.name}...</div>
    </div>`;

  try {
    const res = await fetch(`${API_BASE}/generate-playbook`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        startup: currentStartup,
        community_name: community.name,
        community_platform: community.platform,
        community_description: community.icp_match || '',
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const p = await res.json();
    renderPlaybook(p);
  } catch (err) {
    document.getElementById('pb-body').innerHTML =
      `<div style="color:var(--accent);padding:40px;">Error: ${err.message}</div>`;
  }
}

function renderPlaybook(p) {
  const week1 = (p.week1_actions || []).map(a => `<li>→ ${a}</li>`).join('');
  const dos = (p.dos || []).map(d => `<li>✓ ${d}</li>`).join('');
  const donts = (p.donts || []).map(d => `<li>✗ ${d}</li>`).join('');

  document.getElementById('pb-body').innerHTML = `
    <div class="pb-grid">
      <div class="pb-card">
        <h3>📅 Week 1 Action Plan</h3>
        <ul>${week1}</ul>
      </div>
      <div class="pb-card">
        <h3>🎯 Targets</h3>
        <ul>
          <li>Week 1 goal: ${p.kpis?.week1_target || '—'}</li>
          <li>Conversion goal: ${p.kpis?.conversion_goal || '—'}</li>
        </ul>
        <h3 style="margin-top:16px">Do's & Don'ts</h3>
        <ul>${dos}${donts}</ul>
      </div>
      <div class="pb-card full">
        <h3>📝 First Post (copy-paste ready)</h3>
        <strong>${p.first_post?.title || ''}</strong>
        <div class="post-body">${p.first_post?.body || ''}</div>
      </div>
      <div class="pb-card full">
        <h3>💬 DM Template</h3>
        <div class="dm">${p.first_dm_template || ''}</div>
      </div>
      <div class="pb-card full">
        <h3>💡 Insider Tip</h3>
        <div class="post-body">${p.insider_tip || ''}</div>
      </div>
    </div>`;
}
</script>
</body>
</html>
