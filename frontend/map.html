<!DOCTYPE html>
<!-- -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chick – Network Map Prototype</title>
<style>
  :root {
    --bg: #fbf8ff;
    --surface: #f2efff;
    --surface2: #eae7ff;
    --border: #dcd6f5;
    --accent: #7b6fdb;
    --accent2: #9b91e8;
    --accent3: #c4bcff;
    --accent4: #a78bfa;
    --warning: #c4401a;
    --text: #120d1e;
    --text2: #3d3358;
    --text3: #8f86ad;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent, transparent 30px,
      rgba(43,36,24,0.05) 31px
    );
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .screen.active { display: flex; }
  #screen-input {
    overflow-y: auto;
    padding: 40px 0;
  }

  /* ── SCREEN 1: INPUT ── */
  .input-layout {
    display: flex;
    align-items: center;
    gap: 56px;
    max-width: 920px;
    padding: 0 24px;
  }
  .hero-copy {
    max-width: 320px;
    flex-shrink: 0;
  }
  .hero-copy .logo { text-align: left; margin-bottom: 18px; }
  .hero-tagline {
    font-family: var(--font-display);
    color: var(--accent);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .hero-headline {
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
  }
  .hero-headline em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent2);
  }
  #screen-input .card {
    width: 400px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(43,36,24,0.08);
  }
  @media (max-width: 780px) {
    .input-layout { flex-direction: column; gap: 28px; }
    .hero-copy { text-align: center; max-width: 400px; }
    .hero-copy .logo { text-align: center; }
  }
  .logo {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 24px;
    text-align: center;
    color: var(--text);
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .logo span { color: var(--accent); }
  .logo-icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 50%;
    background-image: url('logo_CHICK.jpeg');
    background-size: 95px 95px;
    background-position: -29px -14px;
    background-repeat: no-repeat;
    box-shadow: 0 2px 6px rgba(43,36,24,0.15);
  }
  .hero-copy .logo { justify-content: flex-start; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text2);
    margin: 14px 0 6px;
  }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 11px 13px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--accent), #5b4fb8);
    border: none;
    border-radius: 10px;
    color: #fff8ee;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(123,111,219,0.3);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text2);
    width: auto;
    padding: 9px 18px;
    font-size: 13px;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(43,36,24,0.06);
  }

  /* ── SCREEN 2: MAP ── */
  #screen-map { flex-direction: row; align-items: stretch; justify-content: flex-start; }
  .side-panel {
    width: 300px;
    flex-shrink: 0;
    height: 100%;
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 110px 18px 24px;
    box-sizing: border-box;
  }
  .side-panel-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .side-panel-sub {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 16px;
  }
  .panel-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .panel-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .panel-score {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .panel-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(123,111,219,0.12);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .panel-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 3px;
  }
  .panel-meta {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.4;
  }
  #screen-map .map-stage-wrap {
    flex: 1;
    position: relative;
    height: 100%;
  }
  .map-header {
    position: absolute;
    top: 24px;
    left: 32px;
    right: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .map-ruler {
    position: absolute;
    top: 96px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 4;
  }
  .map-ruler-line {
    width: 260px;
    height: 1px;
    background: var(--text3);
    margin: 0 auto 8px;
  }
  .map-ruler-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--text2);
    text-transform: uppercase;
  }
  .map-hint {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
  }
  .map-stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .center-node {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 38% 32%, #c4bcff 0%, #a78bfa 50%, #7b6fdb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: #fff8ee;
    padding: 10px;
    box-shadow: 0 16px 36px rgba(91,79,184,0.35), inset 0 -6px 16px rgba(0,0,0,0.15);
    z-index: 5;
  }
  .orbit-node {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    color: #fff8ee;
    cursor: pointer;
    padding: 8px;
    line-height: 1.2;
    overflow: hidden;
    box-shadow: 0 14px 22px rgba(43,36,24,0.32), 0 2px 5px rgba(43,36,24,0.18);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0;
    animation: nodeIn 0.5s ease forwards;
  }
  .orbit-node .node-name {
    font-weight: 700;
    word-break: break-word;
  }
  .orbit-node .node-score {
    font-weight: 600;
    opacity: 0.85;
    white-space: nowrap;
  }
  .orbit-node:hover {
    transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1) !important;
    box-shadow: 0 18px 30px rgba(43,36,24,0.4), 0 3px 6px rgba(43,36,24,0.2);
    z-index: 8;
  }
  @keyframes nodeIn {
    from { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.4); }
    to   { opacity: 1; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1); }
  }
  .connector {
    position: absolute;
    top: 50%; left: 50%;
    height: 1px;
    background: linear-gradient(90deg, rgba(123,111,219,0.35), transparent);
    transform-origin: left center;
    z-index: 1;
  }

  /* ── SCREEN 3: PLAYBOOK FULLSCREEN ── */
  #screen-playbook {
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    overflow-y: auto;
    padding: 40px 60px;
  }
  .playbook-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .playbook-title { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--text); }
  .tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(123,111,219,0.12);
    color: var(--accent);
    margin-top: 8px;
  }
  .pb-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .pb-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 6px 18px rgba(43,36,24,0.06);
  }
  .pb-card.full { grid-column: 1 / -1; }
  .pb-card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .pb-card ul { list-style: none; }
  .pb-card li {
    font-size: 14px;
    color: var(--text2);
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .pb-card li:last-child { border-bottom: none; }
  .post-body, .dm { white-space: pre-wrap; font-size: 13px; color: var(--text2); line-height: 1.7; }
  .center-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- SCREEN 1: INPUT -->
<div class="screen active" id="screen-input">
  <div class="input-layout">
    <div class="hero-copy">
      <div class="logo"><span class="logo-icon"></span>Chick<span>.</span></div>
      <div class="hero-tagline">Your GTM Co-Founder for Founders</div>
      <div class="hero-headline">From idea<br>to <em>first user.</em></div>
    </div>
    <div class="card">
    <label>Startup Name</label>
    <input id="s-name" placeholder="e.g. NoteAI" value="NoteAI" />
    <label>What does it do?</label>
    <textarea id="s-desc">AI tool that automatically writes session notes for therapists after each client call, saving 2+ hours per day</textarea>
    <label>Target customer</label>
    <input id="s-customer" value="Independent therapists running private practices" />
    <label>Stage</label>
    <select id="s-stage">
      <option value="idea">Idea stage</option>
      <option value="pre-launch" selected>Pre-launch</option>
      <option value="launched">Launched (0-100 users)</option>
      <option value="growing">Growing (100+ users)</option>
    </select>
    <label>Sector</label>
    <select id="s-category">
      <option value="healthtech" selected>Healthtech / Wellness</option>
      <option value="b2b-saas">B2B SaaS</option>
      <option value="fintech">Fintech</option>
      <option value="edtech">Edtech</option>
      <option value="developer-tools">Developer Tools</option>
      <option value="ai">AI / ML</option>
      <option value="general-startup">Other / General</option>
    </select>
    <button class="btn" id="find-btn" onclick="findCommunities()">Map My Network →</button>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="loadDemoData()">🧪 Preview with demo data</button>
    </div>
  </div>
</div>

<!-- SCREEN 2: MAP -->
<div class="screen" id="screen-map">
  <div class="side-panel">
    <div class="side-panel-label">Top communities for your ICP</div>
    <div class="side-panel-sub">Verified via Cala — no hallucinated names, no dead groups.</div>
    <div id="side-panel-list"></div>
  </div>
  <div class="map-stage-wrap">
    <div class="map-header">
      <div class="logo"><span class="logo-icon"></span>Chick<span>.</span></div>
      <button class="btn btn-ghost" onclick="goToScreen('screen-input')">← Start over</button>
    </div>
    <div class="map-ruler">
      <div class="map-ruler-line"></div>
      <div class="map-ruler-label" id="map-ruler-label">Communities found</div>
    </div>
    <div class="map-stage" id="map-stage"></div>
    <div class="map-hint">Click a community to generate its activation playbook</div>
  </div>
</div>

<!-- SCREEN 3: PLAYBOOK -->
<div class="screen" id="screen-playbook">
  <div class="playbook-top">
    <div>
      <div class="playbook-title" id="pb-title">—</div>
      <span class="tag" id="pb-platform">—</span>
    </div>
    <button class="btn btn-ghost" onclick="goToScreen('screen-map')">← Back to map</button>
  </div>
  <div id="pb-body"></div>
</div>

<script>
const API_BASE = '/api';
let currentStartup = null;
let currentCommunities = [];

function goToScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadDemoData() {
  currentStartup = {name:'NoteAI', description:'x', target_customer:'therapists', stage:'pre-launch', category:'healthtech'};
  goToScreen('screen-map');
  renderMap([
    {name:'r/therapists', platform:'Reddit', relevance_score:92},
    {name:'Therapist Slack', platform:'Slack', relevance_score:85},
    {name:'r/HealthTech', platform:'Reddit', relevance_score:78},
    {name:'Build In Public Discord', platform:'Discord', relevance_score:65}
  ]);
}

async function findCommunities() {
  currentStartup = {
    name: document.getElementById('s-name').value.trim(),
    description: document.getElementById('s-desc').value.trim(),
    target_customer: document.getElementById('s-customer').value.trim(),
    stage: document.getElementById('s-stage').value,
    category: document.getElementById('s-category').value,
  };
  if (!currentStartup.name || !currentStartup.description || !currentStartup.target_customer) {
    alert('Please fill in all fields.');
    return;
  }

  const btn = document.getElementById('find-btn');
  btn.disabled = true;
  btn.textContent = 'Searching 2,847 communities...';
  const loadingStages = setTimeout(() => {
    btn.textContent = 'Verifying via Cala — no hallucinated names, no dead groups...';
  }, 1400);

  try {
    const res = await fetch(`${API_BASE}/find-communities`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentStartup),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    currentCommunities = data.communities;
    goToScreen('screen-map');
    renderMap(currentCommunities);
  } catch (err) {
    alert('Error connecting to API. Is the backend running on port 8000?\n\n' + err.message);
  } finally {
    clearTimeout(loadingStages);
    btn.disabled = false;
    btn.textContent = 'Map My Network →';
  }
}

const PLATFORM_COLORS = {
  'Reddit': '#8f5fd1',
  'Discord': '#5b7fd1',
  'Slack': '#b06fc9',
  'Facebook': '#6a6fc4',
  'LinkedIn': '#5f8fc9',
  'Forum': '#9b7fd6',
  'Newsletter': '#7a5fb0',
  'Meetup': '#c470a8',
  'Twitter/X': '#4a4a68',
};

function displayName(name) {
  return name.replace(/^r\//i, '');
}

function renderSidePanel(communities) {
  const list = document.getElementById('side-panel-list');
  list.innerHTML = communities.map((c, i) => {
    const score = c.relevance_score || 70;
    return `
      <div class="panel-card">
        <div class="panel-card-top">
          <span class="panel-score">${score}</span>
          <span class="panel-badge">#${i + 1} match</span>
        </div>
        <div class="panel-name">${displayName(c.name)}</div>
        <div class="panel-meta">${c.size || 'Unknown size'} · ${c.platform} · ${c.engagement_level || c.engagement || 'High engagement'}</div>
      </div>`;
  }).join('');
}

function renderMap(communities) {
  const stage = document.getElementById('map-stage');
  stage.innerHTML = '';
  document.getElementById('map-ruler-label').textContent = communities.length + ' communities found';
  renderSidePanel(communities);

  // center node
  const center = document.createElement('div');
  center.className = 'center-node';
  center.textContent = currentStartup.name;
  stage.appendChild(center);

  const cx = stage.clientWidth / 2 || window.innerWidth / 2;
  const cy = stage.clientHeight / 2 || window.innerHeight / 2;
  const n = communities.length;

  // Base bubble size per community, tamed down as the count grows so a busy
  // result set doesn't produce giant overlapping circles — but never so much
  // that the label text has nowhere to go.
  const sizeScale = n <= 6 ? 1 : Math.max(0.75, 6 / n);
  let sizes = communities.map(c => (65 + (c.relevance_score || 70) * 0.6) * sizeScale);

  // Pick a radius large enough that adjacent bubbles (by circumference,
  // weighted by their own diameter) don't touch, then shrink everything
  // proportionally if that radius wouldn't fit on screen.
  const SPACING = 1.35;
  let totalDiameter = sizes.reduce((a, b) => a + b, 0);
  let radius = Math.max(170, (totalDiameter * SPACING) / (2 * Math.PI));
  const maxRadius = Math.min(cx, cy) * 0.78;
  if (radius > maxRadius) {
    const shrink = maxRadius / radius;
    sizes = sizes.map(s => s * shrink);
    radius = maxRadius;
  }

  // Reserve a wedge at the top for the "N communities found" ruler so no
  // bubble ever lands underneath it, regardless of how many there are.
  const EXCLUDE_HALF = 0.6; // radians (~34°) kept clear at the top
  const startAngle = -Math.PI / 2 + EXCLUDE_HALF;
  const totalArc = 2 * Math.PI - 2 * EXCLUDE_HALF;

  communities.forEach((c, i) => {
    const angle = startAngle + ((i + 0.5) / n) * totalArc;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);
    const score = c.relevance_score || 70;
    const size = sizes[i];

    // connector line
    const dist = Math.sqrt(x * x + y * y);
    const angleDeg = Math.atan2(y, x) * (180 / Math.PI);
    const line = document.createElement('div');
    line.className = 'connector';
    line.style.width = dist + 'px';
    line.style.transform = `rotate(${angleDeg}deg)`;
    stage.appendChild(line);

    // node
    const node = document.createElement('div');
    node.className = 'orbit-node';
    node.style.width = size + 'px';
    node.style.height = size + 'px';
    node.style.background = PLATFORM_COLORS[c.platform] || '#8a81b0';
    node.style.setProperty('--tx', x + 'px');
    node.style.setProperty('--ty', y + 'px');
    node.style.animationDelay = (i * 0.06) + 's';
    const cleanName = displayName(c.name);
    if (size < 46) {
      const scoreFont = Math.max(9, size * 0.22);
      node.innerHTML = `<div class="node-score" style="font-size:${scoreFont}px">${score}%</div>`;
    } else {
      // Shrink the name to fit fully (wrapping across up to ~2 lines)
      // rather than truncating with an ellipsis.
      const nameFont = Math.max(7, Math.min(12, (size * 0.85) / Math.max(6, cleanName.length * 0.42)));
      const scoreFont = Math.max(8, nameFont * 0.85);
      node.innerHTML = `<div class="node-name" style="font-size:${nameFont}px">${cleanName}</div><div class="node-score" style="font-size:${scoreFont}px">${score}%</div>`;
    }
    node.title = cleanName;
    node.onclick = () => generatePlaybook(c);
    stage.appendChild(node);
  });
}

async function generatePlaybook(community) {
  goToScreen('screen-playbook');
  document.getElementById('pb-title').textContent = displayName(community.name);
  document.getElementById('pb-platform').textContent = community.platform;
  document.getElementById('pb-body').innerHTML = `
    <div class="center-loading">
      <div class="spinner"></div>
      <div style="color:var(--text2)">Generating activation playbook for ${community.name}...</div>
    </div>`;

  try {
    const res = await fetch(`${API_BASE}/generate-playbook`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        startup: currentStartup,
        community_name: community.name,
        community_platform: community.platform,
        community_description: community.icp_match || '',
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const p = await res.json();
    renderPlaybook(p);
  } catch (err) {
    document.getElementById('pb-body').innerHTML =
      `<div style="color:var(--warning);padding:40px;">Error: ${err.message}</div>`;
  }
}

function renderPlaybook(p) {
  const week1 = (p.week1_actions || []).map(a => `<li>→ ${a}</li>`).join('');
  const dos = (p.dos || []).map(d => `<li>✓ ${d}</li>`).join('');
  const donts = (p.donts || []).map(d => `<li>✗ ${d}</li>`).join('');

  document.getElementById('pb-body').innerHTML = `
    <div class="pb-grid">
      <div class="pb-card">
        <h3>📅 Week 1 Action Plan</h3>
        <ul>${week1}</ul>
      </div>
      <div class="pb-card">
        <h3>🎯 Targets</h3>
        <ul>
          <li>Week 1 goal: ${p.kpis?.week1_target || '—'}</li>
          <li>Conversion goal: ${p.kpis?.conversion_goal || '—'}</li>
        </ul>
        <h3 style="margin-top:16px">Do's & Don'ts</h3>
        <ul>${dos}${donts}</ul>
      </div>
      <div class="pb-card full">
        <h3>📝 First Post (copy-paste ready)</h3>
        <strong>${p.first_post?.title || ''}</strong>
        <div class="post-body">${p.first_post?.body || ''}</div>
      </div>
      <div class="pb-card full">
        <h3>💬 DM Template</h3>
        <div class="dm">${p.first_dm_template || ''}</div>
      </div>
      <div class="pb-card full">
        <h3>💡 Insider Tip</h3>
        <div class="post-body">${p.insider_tip || ''}</div>
      </div>
    </div>`;
}
</script>
</body>
