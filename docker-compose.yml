services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "80"

  frontend:
    build: ./frontend
    container_name: frontend-chick
    volumes:
      - ./frontend:/usr/share/caddy
    environment:
      - BACKEND_UPSTREAM=backend:80
    ports:
      - "9080:80"
    depends_on:
      - backend

  # --- NestJS backend (parallel rewrite, not wired into the frontend yet) ---
  postgres-nest:
    image: postgres:16-bookworm
    environment:
      - POSTGRES_USER=chick
      - POSTGRES_PASSWORD=chick
      - POSTGRES_DB=chick
    volumes:
      - chick_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chick -d chick"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-nest:
    build: ./backend-nest
    env_file:
      - ./backend-nest/.env
    environment:
      - DATABASE_URL=postgres://chick:chick@postgres-nest:5432/chick
    depends_on:
      postgres-nest:
        condition: service_healthy
    ports:
      - "8081:80"

  frontend-react:
    build:
      context: ./frontend-react
      target: production
    ports:
      - "8083:80"
    depends_on:
      - backend-nest

  # Vite dev server (HMR + real error overlay/source maps) instead of the
  # minified production bundle above — use this one while debugging.
  frontend-react-dev:
    build:
      context: ./frontend-react
      target: dev
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - API_PROXY_TARGET=http://backend-nest:80
    ports:
      - "5173:5173"
    depends_on:
      - backend-nest

volumes:
  chick_postgres_data:
